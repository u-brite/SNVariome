name: Validate Rhino app

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
          use-public-rspm: true

      - name: Restore renv library
        uses: r-lib/actions/setup-renv@v2

      - name: Test evidence and module behavior
        shell: Rscript {0}
        run: testthat::test_dir("tests/testthat")

      - name: Lint the Rhino implementation
        shell: Rscript {0}
        run: |
          files <- c(
            "app/main.R",
            list.files("app/logic", pattern = "[.]R$", full.names = TRUE),
            list.files("app/view", pattern = "[.]R$", full.names = TRUE)
          )
          rhino::lint_r(paths = files)
